<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">OF</div>

      <div>
        <h1>Oficina</h1>
        <p>Gestão de serviços</p>
      </div>
    </div>

    <nav class="menu">
      <a
        *ngIf="podeGerenciarSistema()"
        routerLink="/clientes"
        routerLinkActive="active"
        class="menu-link"
      >
        <span>👤</span>
        Clientes
      </a>

      <a
        *ngIf="podeGerenciarSistema()"
        routerLink="/veiculos"
        routerLinkActive="active"
        class="menu-link"
      >
        <span>🚙</span>
        Veículos
      </a>

      <a
        *ngIf="podeGerenciarSistema()"
        routerLink="/itens"
        routerLinkActive="active"
        class="menu-link"
      >
        <span>🧰</span>
        Itens
      </a>

      <a
        routerLink="/ordens-servico"
        routerLinkActive="active"
        class="menu-link"
      >
        <span>📝</span>
        {{ isCliente() ? 'Minhas Ordens' : 'Ordens' }}
      </a>

      <a
        *ngIf="isAdmin()"
        routerLink="/usuarios"
        routerLinkActive="active"
        class="menu-link"
      >
        <span>🔐</span>
        Usuários
      </a>
    </nav>

    <button class="logout-button" (click)="logout()">
      Sair
    </button>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
